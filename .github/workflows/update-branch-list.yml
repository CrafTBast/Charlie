name: Auto-Update Branch List

on:
  create: # Triggers automatically when a branch or tag is created
  delete: # Triggers automatically when a branch or tag is deleted
  workflow_dispatch: # Lets you trigger it manually if you ever need to

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to allow the bot to commit changes to main
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Fetches history so it can see all branches

      - name: Generate branches.txt
        run: |
          git fetch --all --prune
          echo "=== Repository Branches ===" > branches.txt
          echo "Last Updated: $(date -u) UTC" >> branches.txt
          echo "==========================" >> branches.txt
          echo "" >> branches.txt
          
          # More reliable way to list remote branches cleanly
          git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/ | grep -v '^HEAD$' >> branches.txt

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add branches.txt
          
          # Added [skip ci] to prevent infinite workflow trigger loops
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update branches.txt [skip ci]" && git push origin main)
